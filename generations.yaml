generations:
  - name: "First Generation (2006-2009)"
    start_year: 2006
    end_year: 2009
    description: "The BMW E92 is the coupe variant of the fifth-generation 3 Series, introduced in July 2006 and unveiled for the MY2007 model year. It is distinguished from its E90 sedan counterpart by unique styling elements including a more aggressive front fascia, distinctive roofline, and model-specific interior details. The E92 featured a stiffer chassis than the sedan, with every body panel except the doors being unique to the coupe. Early engine options included four-cylinder diesels and naturally aspirated six-cylinder petrol units, with the twin-turbocharged N54-powered 335i producing 306 HP and the naturally aspirated 330i/328i offering refined performance. Transmission options included six-speed manual and automatic gearboxes. The range-topping M3 variant, introduced in 2007, featured a high-revving 4.0L BMW S65 V8 engine producing 414 HP, representing the only V8-powered 3 Series coupe in the model's history."
  - name: "First Generation (2010 Facelift)"
    start_year: 2010
    end_year: 2013
    description: "The 2010 facelift (LCI - Life Cycle Impulse) updated the E92's styling and introduced significant technical changes. The single-turbo N55 replaced the twin-turbo N54 in the 335i, while other engine options were revised. The facelift brought visual updates to the front and rear fascias, updated interior trim, and refreshed infotainment systems. The M3 continued with the S65 V8. Later models received a seven-speed dual-clutch transmission (DCT) option for the M3. The E92 was the last 3 Series coupe, as its successor would be renamed the 4 Series. Production continued through the 2013 model year, ending in October 2013."
